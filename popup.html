<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sponsor Skipper</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 320px; margin: 0; padding: 16px; color: #202124; background: #fff; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
    @media (prefers-color-scheme: dark) {
      body { color: #f1f3f4; background: #202124; }
      .subtle, #empty, .range-time, #rangesCount, .mode-option small { color: #aeb4bb; }
      #statusCard, .range { border-color: #3c4043; }
      .mode { border-top-color: #3c4043; }
      button { color: inherit; background: #292a2d; border-color: #5f6368; }
      #openSettings { color: #8ab4f8; background: transparent; }
    }
    header, .section-heading, footer { display: flex; align-items: center; }
    header { justify-content: space-between; margin-bottom: 14px; }
    header strong { display: block; font-size: 15px; }
    .subtle, #empty, .range-time, #rangesCount, .mode-option small { color: #5f6368; }
    .subtle { font-size: 12px; }
    .switch { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; font-weight: 600; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .track { width: 32px; height: 18px; padding: 2px; border-radius: 11px; background: #9aa0a6; transition: background .15s; }
    .track::after { display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0004; content: ''; transition: transform .15s; }
    .switch input:checked + .track { background: #1a73e8; }
    .switch input:checked + .track::after { transform: translateX(14px); }
    .switch input:focus-visible + .track { outline: 2px solid #1a73e8; outline-offset: 2px; }
    .section-heading { justify-content: space-between; margin-bottom: 4px; }
    .range { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #e8eaed; }
    .range:last-child { border-bottom: 0; }
    .range-label { font-weight: 600; }
    .range-time { display: block; font-size: 12px; }
    button { cursor: pointer; border: 1px solid #dadce0; border-radius: 6px; padding: 5px 9px; color: #202124; background: #fff; font: inherit; white-space: nowrap; }
    button:hover { background: rgba(127, 127, 127, .12); }
    button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 1px; }
    #empty { padding: 9px 0 2px; font-size: 12px; }
    .mode { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e8eaed; }
    .mode-picker { margin: 6px 0 0; padding: 0; border: 0; min-width: 0; }
    .mode-option { display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 8px 0; cursor: pointer; }
    .mode-option input { margin: 3px 0 0; accent-color: #1a73e8; }
    .mode-option strong, .mode-option small { display: block; }
    .mode-option small { margin-top: 1px; font-size: 12px; }
    .key-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e8eaed; }
    .key-label { display: block; margin-bottom: 5px; font-weight: 600; }
    .key-row { display: flex; gap: 7px; }
    #typesafeApiKey { min-width: 0; flex: 1; box-sizing: border-box; padding: 6px 7px; border: 1px solid #dadce0; border-radius: 6px; color: inherit; background: transparent; font: inherit; }
    #typesafeApiKey:focus { outline: 2px solid #1a73e8; outline-offset: 1px; }
    #keyHint { margin-top: 5px; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .key-section { border-top-color: #3c4043; }
      #typesafeApiKey { border-color: #5f6368; }
    }
    footer { justify-content: space-between; gap: 10px; margin-top: 10px; }
    #openSettings { padding: 4px 0; border: 0; color: #1a73e8; background: transparent; }
  </style>
</head>
<body>
  <header>
    <div><strong>Sponsor Skipper</strong><span class="subtle">Skip creator sponsor reads</span></div>
    <label class="switch" title="Enable or disable sponsor skipping">
      <input type="checkbox" id="enabledToggle" />
      <span class="track" aria-hidden="true"></span>
      <span id="enabledLabel">Enabled</span>
    </label>
  </header>

  <section aria-labelledby="rangesTitle">
    <div class="section-heading"><strong id="rangesTitle">Sponsor segments</strong><span id="rangesCount"></span></div>
    <div id="ranges"></div>
    <div id="empty">No sponsor segments detected yet.</div>
  </section>

  <fieldset class="mode mode-picker" aria-labelledby="modeTitle">
    <legend id="modeTitle"><strong>When a sponsor is reached</strong></legend>
    <label class="mode-option">
      <input type="radio" name="skipMode" value="auto" />
      <span><strong>Skip automatically</strong><small>Playback jumps past the segment with no interaction.</small></span>
    </label>
    <label class="mode-option">
      <input type="radio" name="skipMode" value="manual" />
      <span><strong>Ask me first with a “Skip sponsor” button</strong><small>A button appears on the player, like YouTube's own skip button. Nothing is skipped unless you click it.</small></span>
    </label>
  </fieldset>

  <section class="key-section" aria-labelledby="keyTitle">
    <label class="key-label" id="keyTitle" for="typesafeApiKey">Jev API key</label>
    <div class="key-row">
      <input type="password" id="typesafeApiKey" autocomplete="off" spellcheck="false" placeholder="Paste your key" />
      <button id="saveApiKey" type="button">Save</button>
    </div>
    <div id="keyHint" class="subtle">Stored locally and used for direct Jev requests. The local server still prepares captions or audio.</div>
  </section>

  <footer><span id="keyStatus" class="subtle"></span><button id="openSettings" type="button">Settings</button></footer>
  <script src="timeline.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
